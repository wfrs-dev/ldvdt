name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Go tests
        run: go test ./...

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # The JS suites are plain Node scripts with no dependencies.
      - name: JS tests
        run: |
          status=0
          for suite in test/*.js; do
            echo "== $suite"
            node "$suite" || status=1
          done
          exit $status

  generated:
    name: Generated artifacts are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install templ
        run: go install github.com/a-h/templ/cmd/templ@v0.3.1070

      - name: Fail when the committed *_templ.go files are stale
        run: |
          templ generate
          git diff --exit-code

      # layout_gen.go and the embedded SVG copy are generated from docs/ and
      # committed; a stale copy would ship a keyboard that disagrees with the
      # design or with the ids the client resolves. git status (not git diff)
      # also catches a generator that starts emitting a new, untracked file.
      - name: Fail when the generated layout or SVG copy is stale
        run: |
          go generate ./internal/domain
          test -z "$(git status --porcelain)"

  cross-compile:
    name: Cross-compile ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -o /dev/null ./cmd/ldvdt
